# Sem login (SIMPLE_AUTH_MANAGER_ALL_ADMINS): apenas para uso local.
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/projeto/orquestracao/dags
  AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
  PYTHONPATH: /opt/airflow/projeto
  TZ: America/Sao_Paulo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    # migra o banco do Airflow, cria o pool de escrita no DuckDB (1 vaga) e sobe tudo
    command: >
      bash -c "airflow db migrate &&
               airflow pools set duckdb 1 'Escrita serializada no DuckDB (um processo por vez)' &&
               exec airflow standalone"
    environment: *airflow-env
    ports:
      - "8081:8080"
    volumes:
      - ..:/opt/airflow/projeto
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  airflow-db:
